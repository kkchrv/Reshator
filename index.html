<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Решатор</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <!-- ==================== -->
        <!-- ГЛАВНЫЙ ЭКРАН -->
        <!-- ==================== -->

        <section
            id="homeScreen"
            class="screen"
        >

            <h1>Решатор</h1>

            <h2>
                Не можешь решить?<br>
                Решатор решит за тебя
            </h2>

            <p class="question">
                Что решаем?
            </p>

            <div
                id="choices"
                class="choices"
            ></div>

            <button
                id="settingsButton"
                class="settings-button"
            >
                ⚙️ Настройки
            </button>

        </section>


        <!-- ==================== -->
        <!-- НАСТРОЙКИ -->
        <!-- ==================== -->

        <section
            id="settingsScreen"
            class="screen hidden"
        >

            <div class="screen-header">

                <button
                    id="backButton"
                    class="back-button"
                >
                    ←
                </button>

                <h3>
                    Настройки
                </h3>

            </div>

            <p class="settings-description">
                Настраивай существующие категории
                или создавай свои.
            </p>

            <div
                id="settingsList"
                class="settings-list"
            ></div>

            <button
                id="createCategoryButton"
                class="create-category-button"
            >
                ＋ Создать категорию
            </button>

        </section>


        <!-- ==================== -->
        <!-- РЕДАКТОР КАТЕГОРИИ -->
        <!-- ==================== -->

        <section
            id="editorScreen"
            class="screen hidden"
        >

            <div class="screen-header">

                <button
                    id="editorBackButton"
                    class="back-button"
                >
                    ←
                </button>

                <h3>
                    Редактор
                </h3>

            </div>


            <!-- НАСТРОЙКИ КАТЕГОРИИ -->

            <div class="category-editor">

                <div class="category-editor-title">
                    Категория
                </div>

                <div class="category-editor-fields">

                    <input
                        id="editorIconInput"
                        class="editor-icon-input"
                        type="text"
                        maxlength="4"
                        aria-label="Эмодзи категории"
                    >

                    <input
                        id="editorNameInput"
                        class="editor-name-input"
                        type="text"
                        maxlength="40"
                        placeholder="Название категории"
                    >

                </div>

                <button
                    id="saveCategoryChangesButton"
                    class="save-category-button"
                >
                    Сохранить изменения
                </button>

            </div>


            <!-- ПОЗИЦИИ -->

            <div class="editor-section-title">
                Варианты
            </div>

            <div
                id="itemsList"
                class="items-list"
            ></div>


            <!-- ДОБАВЛЕНИЕ ПОЗИЦИИ -->

            <div class="add-item">

                <input
                    id="newItemInput"
                    type="text"
                    placeholder="Новый вариант..."
                    maxlength="100"
                >

                <button id="addItemButton">
                    Добавить
                </button>

            </div>


            <!-- СБРОС -->

            <button
                id="resetListButton"
                class="reset-button"
            >
                Сбросить список
            </button>


            <!-- УДАЛЕНИЕ КАТЕГОРИИ -->

            <button
                id="deleteCategoryButton"
                class="delete-category-button hidden"
            >
                Удалить категорию
            </button>

        </section>

    </main>


    <!-- ==================== -->
    <!-- РУЛЕТКА -->
    <!-- ==================== -->

    <div
        id="rouletteModal"
        class="roulette-modal"
    >

        <div class="roulette-overlay"></div>

        <div class="roulette-window">

            <button
                id="closeRouletteButton"
                class="close-roulette"
                aria-label="Закрыть"
            >
                ×
            </button>

            <p
                id="rouletteCategory"
                class="roulette-category"
            >
                Что поесть?
            </p>

            <div class="slot-machine">

                <div class="slot-window">

                    <div
                        id="slotTrack"
                        class="slot-track"
                    ></div>

                    <div class="slot-marker"></div>

                </div>

            </div>

            <button
                id="shareResultButton"
                class="share-result-btn hidden"
            >
                Поделиться результатом ↗
            </button>

            <button
                id="rerollButton"
                class="reroll-btn"
            >
                Крутить ещё раз 🔄
            </button>

        </div>

    </div>


    <!-- ==================== -->
    <!-- СОЗДАНИЕ КАТЕГОРИИ -->
    <!-- ==================== -->

    <div
        id="categoryModal"
        class="small-modal hidden"
    >

        <div class="small-modal-overlay"></div>

        <div class="small-modal-window">

            <h3>
                Новая категория
            </h3>

            <input
                id="categoryIconInput"
                class="modal-input"
                type="text"
                placeholder="Эмодзи, например 🍕"
                maxlength="4"
            >

            <input
                id="categoryNameInput"
                class="modal-input"
                type="text"
                placeholder="Название категории"
                maxlength="40"
            >

            <div class="modal-actions">

                <button
                    id="cancelCategoryButton"
                    class="modal-secondary-button"
                >
                    Отмена
                </button>

                <button
                    id="saveCategoryButton"
                    class="modal-primary-button"
                >
                    Создать
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
